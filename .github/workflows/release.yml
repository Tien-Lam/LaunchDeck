name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release:
    name: verify-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag and main ancestry
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tags must use v<major>.<minor>.<patch> with an optional prerelease suffix."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release tag ${{ github.ref_name }} is not reachable from main."
            exit 1
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test workflow scripts
        run: >-
          bun test
          ./.github/scripts/pr-policy.test.ts
          ./.github/scripts/write-ci-summary.test.ts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Shared (warnings as errors)
        run: >-
          dotnet build LaunchDeck.Shared/LaunchDeck.Shared.csproj
          --configuration Release
          -warnaserror

      - name: Build Companion (warnings as errors)
        run: >-
          dotnet build LaunchDeck.Companion/LaunchDeck.Companion.csproj
          --configuration Release
          -warnaserror

      - name: Build Tests (warnings as errors)
        run: >-
          dotnet build LaunchDeck.Tests/LaunchDeck.Tests.csproj
          --configuration Release
          -warnaserror

      - name: Run xUnit
        run: >-
          dotnet test LaunchDeck.Tests/LaunchDeck.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

  build-msix:
    name: build-msix
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    uses: ./.github/workflows/build-msix.yml
    with:
      platform: ${{ matrix.platform }}
      configuration: Release
    permissions:
      contents: read

  publish-release:
    name: publish-release
    needs: [verify-release, build-msix]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download verified MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LaunchDeck-*-Release
          path: release-input
          merge-multiple: false

      - name: Create architecture-specific release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $artifacts = Get-ChildItem -Path release-input -Directory
          $platforms = @()

          foreach ($artifact in $artifacts) {
            if ($artifact.Name -notmatch '^LaunchDeck-(x64|ARM64)-Release$') {
              continue
            }
            $platform = $Matches[1]
            $platforms += $platform
            $archive = "release\LaunchDeck-${{ github.ref_name }}-$platform.zip"
            Compress-Archive -Path "$($artifact.FullName)\*" -DestinationPath $archive -Force
          }

          $expected = @("x64", "ARM64")
          $missing = $expected | Where-Object { $_ -notin $platforms }
          if ($missing.Count -gt 0 -or $platforms.Count -ne 2) {
            Write-Error "Expected exactly one verified artifact for x64 and ARM64. Missing: $($missing -join ', ')"
            exit 1
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            **Recommended:** Install from the [Microsoft Store](https://apps.microsoft.com/detail/9PJHCMMVQ6HK) for automatic updates.

            **Sideload:** Download the zip for your architecture, extract it, and right-click `Install.ps1` → **Run with PowerShell** (as Administrator). The install script installs a developer certificate and the MSIX package.

            ## Uninstall

            Right-click `Uninstall.ps1` → **Run with PowerShell** (as Administrator).

            ## Requirements

            - Windows 10 19041+ with Xbox Game Bar
            - x64 or ARM64 matching the downloaded archive
            - Administrator access (for certificate install)
          files: |
            release/LaunchDeck-${{ github.ref_name }}-x64.zip
            release/LaunchDeck-${{ github.ref_name }}-ARM64.zip
