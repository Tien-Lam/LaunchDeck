name: PR Policy

on:
  pull_request_target:
    branches: [main]
    types:
      [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate pull request policy
        uses: actions/github-script@v7
        with:
          script: |
            const {
              isDependabotException,
              validatePullRequest,
            } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-policy.cjs`,
            );
            const pullRequest = context.payload.pull_request;
            const metadata = {
              actor: pullRequest.user.login,
              baseRepoFullName: pullRequest.base.repo.full_name,
              body: pullRequest.body ?? "",
              headRef: pullRequest.head.ref,
              headRepoFullName: pullRequest.head.repo?.full_name ?? "",
              headSha: pullRequest.head.sha,
              headTreeSha: "",
              isDraft: pullRequest.draft,
              title: pullRequest.title,
            };

            if (!pullRequest.draft && !isDependabotException(metadata)) {
              if (!pullRequest.head.repo) {
                core.setFailed(
                  "The PR head repository is unavailable; review evidence cannot be verified.",
                );
                return;
              }
              const commit = await github.rest.git.getCommit({
                owner: pullRequest.head.repo.owner.login,
                repo: pullRequest.head.repo.name,
                commit_sha: pullRequest.head.sha,
              });
              metadata.headTreeSha = commit.data.tree.sha;
            }

            const result = validatePullRequest(metadata);

            await core.summary
              .addHeading("LaunchDeck PR policy")
              .addRaw(
                result.exempt
                  ? "Same-repository Dependabot PR: Linear reference exemption applied."
                  : [
                      `Linear references: ${result.tieReferences.join(", ") || "none"}`,
                      `Review evidence: ${
                        pullRequest.draft
                          ? "deferred while draft"
                          : result.reviewEvidence?.fields["Review session"] || "missing"
                      }`,
                    ].join("\n\n"),
              )
              .write();

            if (result.errors.length > 0) {
              core.setFailed(result.errors.join("\n"));
            }
