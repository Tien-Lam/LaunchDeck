name: Build MSIX

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Windows target architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - ARM64
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    env:
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_CONFIGURATION: ${{ inputs.configuration }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run tests
        run: >-
          dotnet test LaunchDeck.Tests/
          --configuration $env:BUILD_CONFIGURATION
          --verbosity normal

      - name: Create development signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=E37AAF35-F870-4E74-8486-74BED9927C48" `
            -KeyUsage DigitalSignature `
            -FriendlyName "LaunchDeck Actions Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "LaunchDeckBuild" -Force -AsPlainText
          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "$env:GITHUB_WORKSPACE\LaunchDeck.Package\LaunchDeck_Actions.pfx" `
            -Password $password
          Export-Certificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "$env:GITHUB_WORKSPACE\LaunchDeck_Actions.cer"
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build signed MSIX
        run: >-
          msbuild LaunchDeck.sln
          /p:Configuration=$env:BUILD_CONFIGURATION
          /p:Platform=$env:BUILD_PLATFORM
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT
          /p:PackageCertificatePassword=LaunchDeckBuild
          /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\LaunchDeck.Package\LaunchDeck_Actions.pfx"
          /restore

      - name: Stage artifact
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path "LaunchDeck.Package\AppPackages" -Recurse -Filter "*.msix" |
            Where-Object {
              $_.Name -match "_$($env:BUILD_PLATFORM)_$($env:BUILD_CONFIGURATION)\.msix$" -and
              $_.Name -notmatch "Widget"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) {
            Write-Error "No $env:BUILD_PLATFORM $env:BUILD_CONFIGURATION MSIX found"
            exit 1
          }

          New-Item -ItemType Directory -Path "artifact" -Force | Out-Null
          Copy-Item -Path $msix.FullName -Destination "artifact\" -Force
          Copy-Item -Path "LaunchDeck_Actions.cer" -Destination "artifact\" -Force
          Copy-Item -Path "Install.ps1" -Destination "artifact\" -Force
          Copy-Item -Path "Uninstall.ps1" -Destination "artifact\" -Force

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaunchDeck-${{ inputs.platform }}-${{ inputs.configuration }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
