name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test PR policy
        run: bun test ./.github/scripts/pr-policy.test.ts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          dotnet build LaunchDeck.Shared/LaunchDeck.Shared.csproj --configuration Release -warnaserror
          dotnet build LaunchDeck.Companion/LaunchDeck.Companion.csproj --configuration Release -warnaserror
          dotnet build LaunchDeck.Tests/LaunchDeck.Tests.csproj --configuration Release -warnaserror

      - name: Test
        run: dotnet test LaunchDeck.Tests/ --configuration Release --no-build --verbosity normal
